<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Đăng nhập nội bộ</title></head>
<body>
<h1>Đăng nhập nhân sự</h1>
<p th:if="${param.error}">Email hoặc mật khẩu không hợp lệ, hoặc tài khoản chưa được phép đăng nhập.</p>
<p th:if="${param.logout}">Đã đăng xuất.</p>
<p th:if="${param.reauth}">Quyền hoặc trạng thái tài khoản đã thay đổi. Vui lòng đăng nhập lại.</p>
<form th:action="@{/internal/login}" method="post">
    <label>Email trường <input type="email" name="username" autocomplete="username" required></label>
    <label>Mật khẩu <input type="password" name="password" autocomplete="current-password" required></label>
    <button type="submit">Đăng nhập</button>
</form>
</body>
</html>
