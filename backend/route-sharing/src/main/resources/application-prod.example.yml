spring:
  jpa:
    hibernate:
      ddl-auto: validate
  thymeleaf:
    cache: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: true
        same-site: lax
  web:
    error:
      include-message: never
      include-stacktrace: never
